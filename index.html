<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="src/styles.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
	<script type="module" src="src/main.js" defer></script>
	<title>Document</title>
</head>

<body>

	<div id="stage">
		<div class="scene active">
			<video class="video" muted playsinline>
				<source src="assets/sleep.mp4" type="video/mp4">
			</video>
			<div class="label bottom right">
				<div class="label-header">Sleep tracking</div>
			</div>
		</div>

		<div class="scene">
			<video class="video" muted playsinline>
				<source src="assets/skating.mp4" type="video/mp4">
			</video>
			<div class="label bottom right">
				<div class="label-header">Head movement</div>
				<canvas id="c"></canvas>
			</div>
		</div>

		<div class="scene">
			<video class="video" muted playsinline>
				<source src="assets/shooting.mp4" type="video/mp4">
			</video>
			<div class="label bottom right">
				<div class="label-header">Breathing monitoring</div>
			</div>
		</div>
	</div>

</body>

</html>
